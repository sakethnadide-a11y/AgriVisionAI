<section id="contact" class="contact-section">

    <div class="container">

        <div class="section-header">

            <span>CONTACT</span>

            <h2>Get In Touch</h2>

            <p>
                We'd love to hear your feedback or answer your questions.
            </p>

        </div>

        <div class="contact-wrapper">

            <form action="/contact" method="POST">

                <input
                    type="text"
                    name="name"
                    placeholder="Your Name"
                    required>

                <input
                    type="email"
                    name="email"
                    placeholder="Email Address"
                    required>

                <input
                    type="text"
                    name="subject"
                    placeholder="Subject"
                    required>

                <textarea
                    name="message"
                    rows="6"
                    placeholder="Write your message"
                    required></textarea>

                <button type="submit">

                    Send Message

                </button>

            </form>

            <div class="contact-info">

                <h3>AgriVisionAI</h3>

                <p>📍 India</p>

                <p>📧 support@agrivisionai.com</p>

                <p>📞 +91 98765 43210</p>

            </div>

        </div>

    </div>

</section>
